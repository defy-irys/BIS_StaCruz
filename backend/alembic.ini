; =============================================================================
; Alembic configuration.
;
; `sqlalchemy.url` is intentionally left blank here - the real value is
; injected at runtime by `alembic/env.py`, which reads it from
; `app.core.config.settings.DATABASE_URL`. This means a single source of
; truth (the .env file) controls the DB connection for both the running
; app and migrations, instead of keeping the URL in two places.
; =============================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
